# Fly.io deployment config. Used by `fly deploy` and by the deploy job in
# .github/workflows/ci.yml. See docs/DEPLOY.md for the one-time setup.

# Change to your own app name; it becomes https://<app>.fly.dev
app = "temporal-trading-demo"
primary_region = "bom"  # Mumbai

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a throwaway machine before any new version starts. A failing
  # migration exits non-zero, which aborts the release and leaves the running
  # version untouched.
  release_command = "python -m scripts.migrate"
  # Machines are replaced one at a time; a new machine that fails the /healthz
  # check stops the rollout.
  strategy = "rolling"

[env]
  PORT = "5000"
  # Fly terminates TLS in front of the app, so cookies can be HTTPS-only and
  # X-Forwarded-For is set by a proxy that overwrites it.
  SESSION_COOKIE_SECURE = "true"
  TRUST_PROXY_HEADERS = "true"
  # Timescale Cloud only accepts TLS connections; libpq reads this directly.
  PGSSLMODE = "require"

# Web and background jobs run as separate process groups, for the same reason
# they are separate services in docker-compose.yml: jobs must run exactly once.
[processes]
  web = "gunicorn --bind 0.0.0.0:5000 --workers 2 --access-logfile - --error-logfile - backend.app:app"
  worker = "python -m backend.worker"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
